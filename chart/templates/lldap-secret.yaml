{{- if and .Values.lldap.enabled .Values.lldap.secretCreate (not .Values.lldap.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lldap.secretName" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "lldap.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.lldap.secrets.jwtSecret | quote }}
  key-seed: {{ .Values.lldap.secrets.keySeed | quote }}
  admin-password: {{ .Values.lldap.secrets.adminPassword | quote }}
{{- end }}
