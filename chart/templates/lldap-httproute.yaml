{{- if and .Values.lldap.enabled .Values.lldap.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lldap.name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "lldap.selectorLabels" . | nindent 4 }}
  {{- with .Values.lldap.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.lldap.httproute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.lldap.httproute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: {{ .Values.lldap.httproute.pathType }}
            value: {{ .Values.lldap.httproute.path }}
      backendRefs:
        - name: {{ include "lldap.name" . }}
          port: {{ .Values.lldap.service.httpPort }}
{{- end }}
