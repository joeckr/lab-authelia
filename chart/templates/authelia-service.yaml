apiVersion: v1
kind: Service
metadata:
  name: {{ include "authelia.name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "authelia.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.authelia.service.type }}
  ports:
    - port: {{ .Values.authelia.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "authelia.selectorLabels" . | nindent 4 }}
