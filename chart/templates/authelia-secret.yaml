{{- if not .Values.authelia.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authelia.secretName" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "authelia.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.authelia.secrets.jwtSecret | quote }}
  session-secret: {{ .Values.authelia.secrets.sessionSecret | quote }}
  storage-encryption-key: {{ .Values.authelia.secrets.storageEncryptionKey | quote }}
  ldap-password: {{ default .Values.lldap.secrets.adminPassword .Values.authelia.secrets.ldapPassword | quote }}
  {{- if .Values.authelia.notifier.smtp.enabled }}
  smtp-password: {{ .Values.authelia.secrets.smtpPassword | quote }}
  {{- end }}
{{- end }}
