{{- if .Values.authelia.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "authelia.name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "authelia.selectorLabels" . | nindent 4 }}
  {{- with .Values.authelia.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.authelia.httproute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.authelia.hostname | quote }}
  rules:
    - matches:
        - path:
            type: {{ .Values.authelia.httproute.pathType }}
            value: {{ .Values.authelia.httproute.path }}
      backendRefs:
        - name: {{ include "authelia.name" . }}
          port: {{ .Values.authelia.service.port }}
{{- end }}
