{{- if .Values.lldap.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lldap.name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- include "lldap.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.lldap.service.type }}
  ports:
    - port: {{ .Values.lldap.service.ldapPort }}
      targetPort: ldap
      protocol: TCP
      name: ldap
    - port: {{ .Values.lldap.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lldap.selectorLabels" . | nindent 4 }}
{{- end }}
